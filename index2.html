<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SecurityDashboard</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Heroicons -->
  <script src="https://unpkg.com/heroicons@2.0.18/dist/heroicons.js"></script>
</head>

<body>

  <!-- Toggle Button -->
  <button id="toggleSidebar">☰</button>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">

    <h2 class="logo">SecurityDashboard</h2>

    <nav>

      <ul>
        <li class="active">
          <svg class="icon"><use href="#chart-bar-20-solid"></use></svg>
          Dashboard
        </li>

        <li>
          <svg class="icon"><use href="#folder-20-solid"></use></svg>
          Events
        </li>

        <li>
          <svg class="icon"><use href="#bell-alert-20-solid"></use></svg>
          Alerts
        </li>

        <li>
          <svg class="icon"><use href="#chart-pie-20-solid"></use></svg>
          Analytics
        </li>
      </ul>

      <!-- Untermenü -->
      <h4 class="submenu-title">
        <svg class="icon"><use href="#shield-check-20-solid"></use></svg>
        Security Controls
      </h4>

      <ul class="submenu">
        <li>
          <svg class="icon"><use href="#shield-check-20-solid"></use></svg>
          Blocklists
        </li>

        <li>
          <svg class="icon"><use href="#cog-20-solid"></use></svg>
          Config
        </li>

        <li>
          <svg class="icon"><use href="#users-20-solid"></use></svg>
          User Management
        </li>
      </ul>

    </nav>
  </aside>

  <!-- Inhalt -->
  <main id="content">
    <!-- ⭐ HIER kommt dein alter Inhalt rein ⭐ -->
    <h1>Willkommen im SecurityDashboard</h1>
    <p>Hier erscheinen deine Inhalte…</p>
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleSidebar");
    const submenuTitle = document.querySelector(".submenu-title");
    const submenu = document.querySelector(".submenu");

    // Sidebar ein/ausblenden
    toggleBtn.onclick = () => {
      sidebar.classList.toggle("collapsed");
    };

    // Untermenü ein/ausklappen
    submenuTitle.onclick = () => {
      submenu.classList.toggle("open");
    };
  </script>

</body>
</html>
