<style>
  :root{ --bg:#fff;--panel:#F7F8FA;--line:#E3E6EA;--text:#1A1D22;--muted:#767E8A;--accent:#E30613; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:32px 16px 80px;}
  .wrap{max-width:none;width:100%;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em;border-bottom:2px solid var(--accent);padding-bottom:14px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 8px;}
  input[type=text], select, input[type=number]{font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--text);outline:none;}
  #filterSecurity{min-width:260px;}
  .date-range{display:flex;gap:6px;align-items:center;}
  .date-range label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .date-range input[type=date]{width:140px;}
  button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:3px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--text);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button:hover{border-color:var(--text);}
  .footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}
  .improvement-input{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 10px;min-width:200px;vertical-align:middle;}
  .improvement-input::placeholder{color:var(--muted);}
  #improvementSaveBtn{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  button:disabled, a.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
  .count-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin:0 0 14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);background:var(--panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  td{padding:0 6px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.05;}
  td input, td select{width:100%;padding:2px 6px;font-size:12px;}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:10px;}
  .status.error{color:#C0293D;} .status.ok{color:#1F8A6E;}
  .settings{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;display:none;gap:8px;}
  .settings.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
  .settings label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .table-wrap{overflow-x:auto;max-height:60vh;overflow-y:auto;}
  .topnav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;max-width:960px;width:100%;margin:0 auto 24px;padding:0 0 10px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;scrollbar-width:none;}
  .topnav::-webkit-scrollbar{display:none;}
  .topnav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--text);border-color:var(--line);}
  .nav-dropdown{position:relative;}
  .nav-dropdown>.dd-toggle{background:none;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer;}
  .nav-dropdown>.dd-toggle:hover,.nav-dropdown.open>.dd-toggle{color:var(--text);border-color:var(--line);}
  .nav-dropdown.active-group>.dd-toggle{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}
  .dd-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:4px;min-width:180px;display:none;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.09);z-index:1000;padding:4px;}
  .dd-menu.show{display:flex;}
  .dd-menu a{padding:8px 10px;border-radius:3px;color:var(--muted);text-decoration:none;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .dd-menu a:hover{background:var(--panel);color:var(--text);}
  .dd-menu a.active{color:var(--text);font-weight:600;background:rgba(227,6,19,0.06);}
  .topnav a.active{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}
</style>

<script>
(function(){
  var dd = document.getElementById('editorsDropdown');
  if(!dd) return;
  var toggle = document.getElementById('editorsToggle');
  var menu = document.getElementById('editorsMenu');
  // Move the menu to <body> so it can never be trapped inside an ancestor's
  // stacking/clipping context (e.g. the horizontally-scrolling topnav).
  document.body.appendChild(menu);
  function positionMenu(){
    var r = toggle.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.left = r.left + 'px';
  }
  function closeMenu(){ dd.classList.remove('open'); menu.classList.remove('show'); }
  function openMenu(){ positionMenu(); dd.classList.add('open'); menu.classList.add('show'); }
  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    if(menu.classList.contains('show')) closeMenu(); else openMenu();
  });
  document.addEventListener('click', function(e){
    if(!dd.contains(e.target) && !menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeMenu();
  });
  window.addEventListener('resize', function(){ if(menu.classList.contains('show')) positionMenu(); });
  window.addEventListener('scroll', function(){ if(menu.classList.contains('show')) positionMenu(); }, true);
})();
</script>

<script>
// Safety net: define the shared schema-guard helpers locally if the loaded
// assets/turso-data.js doesn't have them yet (e.g. stale cached copy). Avoids
// a hard "X is not defined" crash; the real versions in turso-data.js take
// over automatically once that file is up to date (session-cached there).
if (typeof ensureSecurityMasterSchema === 'undefined') {
  window.ensureSecurityMasterSchema = async function(){
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN DateLaunch TEXT'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN DateTerminated TEXT'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN Status INTEGER'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN Comments TEXT'); } catch(e) {}
  };
}
if (typeof ensureSecurityTasksSchema === 'undefined') {
  window.ensureSecurityTasksSchema = async function(){
    try {
      await tursoRun(`CREATE TABLE IF NOT EXISTS security_tasks (
        TaskID INTEGER PRIMARY KEY AUTOINCREMENT,
        TaskName TEXT NOT NULL,
        TaskDescription TEXT,
        SecurityID INTEGER,
        DateDue TEXT,
        Recurring TEXT,
        Completed INTEGER DEFAULT 0,
        CompletedAt TEXT,
        created_at TEXT
      )`);
    } catch(e) {}
    try { await tursoRun('ALTER TABLE security_tasks ADD COLUMN TaskTypeID INTEGER'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_tasks ADD COLUMN Priority TEXT'); } catch(e) {}
    try {
      await tursoRun(`CREATE TABLE IF NOT EXISTS security_task_completions (
        CompletionID INTEGER PRIMARY KEY AUTOINCREMENT,
        TaskID INTEGER,
        TaskName TEXT,
        SecurityID INTEGER,
        DateDue TEXT,
        CompletedAt TEXT
      )`);
    } catch(e) {}
  };
}
if (typeof ensureSecurityDataSchema === 'undefined') {
  window.ensureSecurityDataSchema = async function(){
    try { await tursoRun('ALTER TABLE security_data ADD COLUMN Source TEXT'); } catch(e) {}
  };
}
if (typeof ensureAssetComparisonSchema === 'undefined') {
  window.ensureAssetComparisonSchema = async function(){
    try { await tursoRun(`CREATE TABLE IF NOT EXISTS asset_comparison_group (
      GroupID INTEGER PRIMARY KEY AUTOINCREMENT,
      GroupName TEXT NOT NULL,
      created_at TEXT
    )`); } catch(e) {}
    try { await tursoRun(`CREATE TABLE IF NOT EXISTS asset_comparison_member (
      GroupID INTEGER NOT NULL,
      SecurityID INTEGER NOT NULL,
      created_at TEXT,
      PRIMARY KEY (GroupID, SecurityID)
    )`); } catch(e) {}
  };
}
</script>
<script>
let rows = [];
let masterRows = [];
let trxArtOpts = [];
let deleteQueue = [];

function secOptions(selected) {
  return masterRows.map(m => `<option value="${m.SecurityID}" ${String(m.SecurityID)===String(selected)?'selected':''}>${m.SecurityName} · ${m.SecurityID}</option>`).join('');
}
// Native <input type="date"> always yields ISO yyyy-mm-dd (or '').
function parseIsoDateInput(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const dt = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  return isNaN(dt) ? null : dt;
}
// The date filter (on DateTrx) only takes effect when "Apply" is pressed (or
// Enter is pressed in one of the fields) — not on every keystroke/selection.
let activeDateFrom = null;
let activeDateTo = null;
function applyDateFilter(){
  activeDateFrom = parseIsoDateInput(document.getElementById('dateFrom').value);
  activeDateTo = parseIsoDateInput(document.getElementById('dateTo').value);
  renderAll(document.getElementById('filterSecurity').value);
}
function trxArtOptions(selected) {
  return trxArtOpts.map(o => `<option value="${o.ParameterID}" ${String(o.ParameterID)===String(selected)?'selected':''}>${o.ParameterName}</option>`).join('');
}
function renderRow(row, idx) {
  return `<tr data-idx="${idx}">
    <td><select data-field="SecurityID">${secOptions(row.SecurityID)}</select></td>
    <td><select data-field="TrxArt">${trxArtOptions(row.TrxArt)}</select></td>
    <td><input type="text" data-field="DateTrx" value="${row.DateTrx||''}" placeholder="dd.mm.yyyy"></td>
    <td><input type="text" data-field="DateValuta" value="${row.DateValuta||''}" placeholder="dd.mm.yyyy"></td>
    <td><input type="number" step="any" data-field="Quantity" value="${row.Quantity??''}"></td>
    <td><input type="number" step="any" data-field="AmtCHF" value="${row.AmtCHF??''}"></td>
    <td><input type="number" step="any" data-field="AmtLC" value="${row.AmtLC??''}"></td>
    <td><input type="number" step="any" data-field="ExpenseCHF" value="${row.ExpenseCHF??''}"></td>
    <td><input type="number" step="any" data-field="ExpenseLC" value="${row.ExpenseLC??''}"></td>
    <td><input type="text" data-field="Source" value="${row.Source||''}"></td>
    <td><input type="text" data-field="Comments" value="${row.Comments||''}"></td>
    <td><input type="text" data-field="TrxReference" value="${row.TrxReference||''}"></td>
    <td><button data-del="${idx}">✕</button></td>
  </tr>`;
}
function updateSelectionLinks(secId) {
  const linkSecurityForm = document.getElementById('linkSecurityForm');
  const btnSecurityForm = document.getElementById('btnSecurityForm');
  if (secId) {
    linkSecurityForm.href = `security.html?id=${encodeURIComponent(secId)}`;
    linkSecurityForm.classList.remove('disabled'); btnSecurityForm.disabled = false;
  } else {
    linkSecurityForm.removeAttribute('href'); linkSecurityForm.classList.add('disabled'); btnSecurityForm.disabled = true;
  }
}
function renderAll(filterSecId='') {
  const body = document.getElementById('body');
  const dateToEnd = activeDateTo ? new Date(activeDateTo.getFullYear(), activeDateTo.getMonth(), activeDateTo.getDate(), 23,59,59) : null;

  const filtered = rows.map((r,i)=>({r,i}))
    .filter(({r}) => !filterSecId || String(r.SecurityID) === String(filterSecId))
    .filter(({r}) => { if(!activeDateFrom) return true; const dt = parseSwissDate(r.DateTrx); return dt && dt >= activeDateFrom; })
    .filter(({r}) => { if(!dateToEnd) return true; const dt = parseSwissDate(r.DateTrx); return dt && dt <= dateToEnd; })
    .sort((a,b) => (parseSwissDate(b.r.DateTrx)||0) - (parseSwissDate(a.r.DateTrx)||0));

  document.getElementById('countLine').textContent = `Total ${rows.length} · ${filtered.length} selected`;
  updateSelectionLinks(filterSecId);

  body.innerHTML = filtered.length ? filtered.slice(0,300).map(({r,i}) => renderRow(r,i)).join('') : '<tr><td colspan="13">No entries.</td></tr>';

  body.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', () => {
      const idx = Number(el.closest('tr').dataset.idx);
      rows[idx][el.dataset.field] = el.value;
      rows[idx]._dirty = true;
    });
  });
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.del);
      if (!confirm('Delete this transaction?')) return;
      if (!rows[idx]._new) deleteQueue.push(rows[idx].id);
      rows.splice(idx,1);
      renderAll(document.getElementById('filterSecurity').value);
    });
  });
}

async function load() {
  if (!tursoConfigured()) {
    document.getElementById('body').innerHTML = `<tr><td colspan="13">Please set Repo/Token first.</td></tr>`;
    document.getElementById('settingsPanel').classList.add('show');
    return;
  }
  try {
    const [txnRows, master, trxArts] = await Promise.all([
      tursoQuery('SELECT id, SecurityID, DateTrx, DateValuta, TrxArt, Quantity, AmtCHF, AmtLC, ExpenseCHF, ExpenseLC, Source, Comments, TrxReference FROM security_transactions'),
      tursoQuery('SELECT SecurityID, SecurityName FROM security_master ORDER BY SecurityName COLLATE NOCASE ASC', [], 3600000),
      tursoParameterOptions('security_transactions','TrxArt'),
    ]);
    rows = txnRows.map(r => ({ ...r, _dirty:false, _new:false }));
    masterRows = master;
    trxArtOpts = trxArts;
    deleteQueue = [];

    const sel = document.getElementById('filterSecurity');
    sel.innerHTML = '<option value="">All securities…</option>' + secOptions('');

    const urlId = new URLSearchParams(location.search).get('id');
    if (urlId && masterRows.some(m => String(m.SecurityID) === urlId)) { sel.value = urlId; renderAll(urlId); }
    else renderAll();
    if (new URLSearchParams(location.search).get('add') === '1') { document.getElementById('addBtn').click(); }
    setStatus(`${rows.length} transactions loaded.`, 'ok');
  } catch (e) {
    document.getElementById('body').innerHTML = `<tr><td colspan="13">Error: ${e.message}</td></tr>`;
  }
}
function setStatus(msg, cls) { const s = document.getElementById('status'); s.textContent = msg; s.className = 'status ' + (cls||''); }

document.getElementById('filterSecurity').addEventListener('change', (e) => renderAll(e.target.value));
document.getElementById('dateApplyBtn').addEventListener('click', applyDateFilter);
document.getElementById('dateFrom').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyDateFilter(); });
document.getElementById('dateTo').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyDateFilter(); });

document.getElementById('addBtn').addEventListener('click', () => {
  const secId = document.getElementById('filterSecurity').value || (masterRows[0] && masterRows[0].SecurityID) || '';
  const buyArt = trxArtOpts.find(o => o.ParameterName === 'Buy');
  rows.push({ id:null, SecurityID: secId, TrxArt: buyArt ? buyArt.ParameterID : '', DateTrx: nowZurichDateString(), DateValuta: nowZurichDateString(),
    Quantity:'', AmtCHF:'', AmtLC:'', ExpenseCHF:'', ExpenseLC:'', Source:'manual', Comments:'', TrxReference:'', _dirty:true, _new:true });
  renderAll(document.getElementById('filterSecurity').value);
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!tursoConfigured()) { setStatus('Please set Repo/Token first.', 'error'); document.getElementById('settingsPanel').classList.add('show'); return; }
  for (const r of rows) {
    if (r.DateTrx && !parseSwissDate(r.DateTrx)) { setStatus(`Invalid DateTrx "${r.DateTrx}" - expected dd.mm.yyyy.`, 'error'); return; }
    if (r.DateValuta && !parseSwissDate(r.DateValuta)) { setStatus(`Invalid DateValuta "${r.DateValuta}" - expected dd.mm.yyyy.`, 'error'); return; }
  }
  const stmts = []; const newRowIdxs = [];
  rows.forEach((r,i) => {
    if (!r._dirty) return;
    if (r._new) {
      stmts.push({ sql:`INSERT INTO security_transactions (SecurityID, DateTrx, DateValuta, TrxArt, Quantity, AmtCHF, AmtLC, ExpenseCHF, ExpenseLC, Source, Comments, TrxReference, created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        args:[r.SecurityID, r.DateTrx, r.DateValuta, r.TrxArt||null, r.Quantity||null, r.AmtCHF||null, r.AmtLC||null, r.ExpenseCHF||null, r.ExpenseLC||null, r.Source, r.Comments, r.TrxReference, nowZurichString()] });
      newRowIdxs.push(i);
    } else {
      stmts.push({ sql:`UPDATE security_transactions SET SecurityID=?, DateTrx=?, DateValuta=?, TrxArt=?, Quantity=?, AmtCHF=?, AmtLC=?, ExpenseCHF=?, ExpenseLC=?, Source=?, Comments=?, TrxReference=? WHERE id=?`,
        args:[r.SecurityID, r.DateTrx, r.DateValuta, r.TrxArt||null, r.Quantity||null, r.AmtCHF||null, r.AmtLC||null, r.ExpenseCHF||null, r.ExpenseLC||null, r.Source, r.Comments, r.TrxReference, r.id] });
    }
  });
  for (const id of deleteQueue) stmts.push({ sql:`DELETE FROM security_transactions WHERE id=?`, args:[id] });

  if (!stmts.length) { setStatus('No changes.', 'ok'); return; }
  try {
    setStatus('Saving…');
    const results = await tursoBatch(stmts);
    let seen = 0;
    for (let ri=0; ri<stmts.length; ri++) {
      if (stmts[ri].sql.startsWith('INSERT')) { rows[newRowIdxs[seen++]].id = results[ri].lastInsertRowid; rows[newRowIdxs[seen-1]]._new = false; }
    }
    rows.forEach(r => r._dirty=false);
    deleteQueue = [];
    renderAll(document.getElementById('filterSecurity').value);
    setStatus('Saved ✓ ' + nowZurichString(), 'ok');
  } catch (e) { setStatus('Error while saving: ' + e.message, 'error'); }
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('cfgUrl').value = TURSO.url;
  document.getElementById('cfgToken').value = TURSO.token;
  document.getElementById('settingsPanel').classList.toggle('show');
});
document.getElementById('cfgSave').addEventListener('click', () => {
  tursoSaveConfig({ url: document.getElementById('cfgUrl').value.trim(), token: document.getElementById('cfgToken').value.trim() });
  document.getElementById('settingsPanel').classList.remove('show');
  load();
});

load();

// ============ Improvement quick-capture (footer) ============
(function(){
  var btn = document.getElementById('improvementSaveBtn');
  if(!btn) return;
  btn.addEventListener('click', async function(){
    var input = document.getElementById('improvementInput');
    var text = input.value.trim();
    if(!text){ return; }
    if(!tursoConfigured()){ alert('Bitte zuerst ⚙ Repo/Token setzen.'); return; }
    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Speichere…';
    try {
      await ensureSecurityTasksSchema();
      var pageName = (location.pathname.split('/').pop() || 'index.html');
      var todayDate = (typeof nowZurichIsoDateString === 'function') ? new Date(nowZurichIsoDateString()+'T00:00:00')
        : (typeof zurichParts === 'function' ? (function(){ var p = zurichParts(new Date()); return new Date(p.year+'-'+p.month+'-'+p.day+'T00:00:00'); })() : new Date());
      var due = new Date(todayDate); due.setDate(due.getDate()+10);
      var dueIso = due.toISOString().slice(0,10);
      var nowIso = (typeof nowZurichString === 'function') ? nowZurichString() : new Date().toISOString();
      await tursoRun(
        `INSERT INTO security_tasks (TaskName, TaskDescription, SecurityID, DateDue, Recurring, TaskTypeID, Completed, created_at) VALUES (?,?,?,?,?,?,0,?)`,
        ['Improvement ' + pageName, text, null, dueIso, 'n/a', 140, nowIso]
      );
      input.value = '';
      alert('Improvement-Task erstellt (fällig ' + dueIso.split('-').reverse().join('.') + ').');
    } catch(e) {
      alert('Fehler: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  });
})();
