<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migration Turso → D1</title>
<style>
body{font:14px/1.4 -apple-system,Inter,sans-serif;margin:0;padding:16px;max-width:900px}
h1{font-size:18px} button{font:inherit;padding:8px 12px;margin:4px 4px 4px 0}
pre{background:#111;color:#ddd;padding:10px;border-radius:6px;overflow:auto;max-height:55vh;font-size:12px;white-space:pre-wrap}
.note{color:#666;margin:6px 0 12px}
</style></head><body>
<h1>Migration Turso → D1 (temporär)</h1>
<p class="note">Reihenfolge von oben nach unten. Jeder Schritt ist wiederholbar. Turso wird nur gelesen. Nach erfolgreicher Verifikation diese Seite, <code>src/migrate.js</code> und die TURSO-Secrets entfernen.</p>
<div>
  <button id="b1">1 Prüfen (Report)</button>
  <button id="b2">2a Parameter: Trockenlauf</button><button id="b3">2b Parameter: anwenden</button>
  <button id="b4">3a Master: Trockenlauf</button><button id="b5">3b Master: anwenden</button>
  <button id="b6">4 Fehlende Tabellen kopieren</button>
  <button id="b7">5 Indizes</button>
  <button id="b8">6a Kurse: Trockenlauf</button><button id="b9">6b Kurse: ergänzen</button>
  <button id="b10">7 Verifikation</button>
</div>
<pre id="log">bereit</pre>
<script>
const log = (t) => { const el = document.getElementById('log'); el.textContent += '\n' + (typeof t === 'string' ? t : JSON.stringify(t, null, 2)); el.scrollTop = el.scrollHeight; };
const base = '/api/admin/migrate/';
async function call(path, method = 'GET') {
  const r = await fetch(base + path, { method, credentials: 'same-origin', redirect: 'manual' });
  if (r.type === 'opaqueredirect' || r.status === 401) throw new Error('Sitzung abgelaufen - Seite neu laden');
  const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function guarded(fn) { try { await fn(); } catch (e) { log('FEHLER: ' + e.message); } }
const btn = (id, fn) => document.getElementById(id).addEventListener('click', () => guarded(fn));

btn('b1', async () => log(await call('report')));
btn('b2', async () => log(await call('sync?table=security_parameter&dry=1', 'POST')));
btn('b3', async () => { if (confirm('Parameter in D1 schreiben?')) log(await call('sync?table=security_parameter', 'POST')); });
btn('b4', async () => log(await call('sync?table=security_master&dry=1', 'POST')));
btn('b5', async () => { if (confirm('Master in D1 schreiben?')) log(await call('sync?table=security_master', 'POST')); });
btn('b6', async () => {
  const rep = await call('report');
  const todo = rep.tables.filter(t => !t.in_d1 && !['security_master','security_parameter','security_prices'].includes(t.table));
  if (!todo.length) return log('Keine fehlenden Tabellen.');
  if (!confirm('Kopieren: ' + todo.map(t => `${t.table} (${t.turso_rows})`).join(', '))) return;
  for (const t of todo) {
    let offset = 0, first = true;
    for (;;) {
      const r = await call(`copy?table=${encodeURIComponent(t.table)}&offset=${offset}&rows=300${first ? '&reset=1' : ''}`, 'POST');
      first = false; offset = r.next_offset;
      log(`${t.table}: ${Math.min(offset, r.total)}/${r.total}`);
      if (r.done) break;
    }
  }
  log('Kopieren fertig.');
});
btn('b7', async () => log(await call('indexes', 'POST')));
async function prices(dry) {
  let after = 0, sum = 0, n = 0;
  for (;;) {
    const r = await call(`prices?after=${after}&limit=12${dry ? '&dry=1' : ''}`, 'POST');
    if (r.done) break;
    after = r.next_after; sum += r.would_insert_or_inserted; n += r.securities;
    log(`bis SecurityID ${after}: ${n} Securities, ${sum} Zeilen ${dry ? 'würden ergänzt' : 'ergänzt'}`);
  }
  log(`Kurse ${dry ? 'Trockenlauf' : 'Ergänzung'} fertig: ${sum} Zeilen.`);
}
btn('b8', () => prices(true));
btn('b9', async () => { if (confirm('Fehlende Kurse in D1 schreiben?')) await prices(false); });
btn('b10', async () => log(await call('verify')));
</script></body></html>
