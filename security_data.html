<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Data</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff;--panel:#F7F8FA;--line:#E3E6EA;--text:#1A1D22;--muted:#767E8A;--accent:#E30613;--gain:#1F8A6E;--loss:#C0293D; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:32px 16px 80px;display:flex;flex-direction:column;align-items:center;}
  .topnav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;max-width:900px;width:100%;margin:0 auto 24px;padding:0 0 10px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;scrollbar-width:none;}
  .topnav::-webkit-scrollbar{display:none;}
  .topnav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--text);border-color:var(--line);}
  .nav-dropdown{position:relative;}
  .nav-dropdown>.dd-toggle{background:none;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer;}
  .nav-dropdown>.dd-toggle:hover,.nav-dropdown.open>.dd-toggle{color:var(--text);border-color:var(--line);}
  .nav-dropdown.active-group>.dd-toggle{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}

  .nav-dropdown.open .dd-menu{display:flex;}

  .toggle-btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block;}
  .toggle-btn:hover{border-color:var(--muted);color:var(--text);}

  .detail-header{padding-bottom:14px;border-bottom:2px solid var(--accent);}
  .detail-header h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 6px;}
  .detail-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

  .section-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
  th.num{text-align:right;}
  td{padding:7px 6px;border-bottom:1px solid var(--line);}
  td.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  td.desc{color:var(--muted);font-size:12px;}
  .empty,.error{padding:20px 6px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .error{color:var(--loss);}
  .table-wrap{overflow-x:auto;}

  .settings{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin:16px 0;display:none;gap:8px;}
  .settings.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
  .settings label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .settings input{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--text);}
  .settings button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}

  .manual-form{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin:16px 0;display:none;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .manual-form.show{display:grid;}
  .manual-form label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .manual-form select,.manual-form input{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--text);}
  .manual-form .full{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .manual-form button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
  .manual-form .msg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .manual-form .msg.ok{color:var(--gain);}
  .manual-form .msg.error{color:var(--loss);}

  .section-title-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .section-title-row .section-title{margin:28px 0 4px;flex:1;}

  .chart-flex{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-top:8px;}
  .chart-flex .table-wrap{flex:1;min-width:240px;margin-top:0;}
  .pie-legend{list-style:none;margin:0;padding:0;font-family:'IBM Plex Mono',monospace;font-size:12px;display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .pie-legend li{display:flex;align-items:center;gap:6px;}
  .pie-swatch{width:10px;height:10px;border-radius:2px;flex:none;}
  .pie-legend .p-name{flex:1;color:var(--text);}
  .pie-legend .p-val{color:var(--muted);}
  .total-row td{font-weight:600;border-top:2px solid var(--line);}
</style>

<script src="assets/turso-data.js"></script>
<script>
let masterAll = [];
let curSecId = null;
let curData = [];

// DataTypes rendered in this order, each as its own section.
const SECTION_DEFS = [
  { dataType: 'FundOverview',   title: 'Fund Overview',    nameLabel: 'Field',  valueLabel: 'Value',  sortDesc: false },
  { dataType: 'FundOperations', title: 'Fund Operations',  nameLabel: 'Field',  valueLabel: 'Value',  sortDesc: false },
  { dataType: 'Fundamentals',   title: 'Fundamentals',     nameLabel: 'Field',  valueLabel: 'Value',  sortDesc: false },
  { dataType: 'AssetClass',     title: 'Asset Allocation', nameLabel: 'Asset Class', valueLabel: 'Weight', sortDesc: true, pie: true },
  { dataType: 'SectorWeight',   title: 'Sector Weights',   nameLabel: 'Sector', valueLabel: 'Weight', sortDesc: true, pie: true },
  { dataType: 'BondRating',     title: 'Bond Ratings',     nameLabel: 'Rating', valueLabel: 'Weight', sortDesc: true },
  { dataType: 'TopHolding',     title: 'Top Holdings',     nameLabel: 'Holding', valueLabel: 'Weight', sortDesc: true, total: true },
  { dataType: 'EquityHolding',  title: 'Equity Holdings',  nameLabel: 'Holding', valueLabel: 'Weight', sortDesc: true },
  { dataType: 'BondHolding',    title: 'Bond Holdings',    nameLabel: 'Holding', valueLabel: 'Weight', sortDesc: true },
];

const PIE_PALETTE = ['#E30613','#1F8A6E','#2C6FBB','#D9A441','#7A5FC0','#C0293D','#3FA7A0','#B5793A','#6F7B8C','#9C4F96','#4C8B3B','#B0A03F'];

function fmtValue(row){
  if(row.NumericValue !== null && row.NumericValue !== undefined){
    const decimals = row.Unit === '%' ? 2 : (Math.abs(row.NumericValue) >= 1000 ? 0 : 2);
    const formatted = fmtDecimal(row.NumericValue, decimals);
    return row.Unit ? `${formatted} ${row.Unit}` : formatted;
  }
  if(row.FieldValue) return row.FieldValue;
  return '—';
}

function describeArcPath(cx, cy, r, startAngle, endAngle){
  const toXY = (angle) => { const rad=(angle-90)*Math.PI/180; return { x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad) }; };
  const start = toXY(endAngle), end = toXY(startAngle);
  const largeArc = (endAngle-startAngle) <= 180 ? 0 : 1;
  if(endAngle-startAngle >= 359.999) return `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`;
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}

function renderPieSvg(entries){
  // entries: [{name, value}], already positive, sorted desc.
  const total = entries.reduce((s,e) => s + (e.value||0), 0);
  if(!total) return { svg:'', legend:'' };
  const size=160, r=70, cx=size/2, cy=size/2;
  let angle=0, slices='';
  entries.forEach((e,i) => {
    const share = e.value/total, endAngle = angle+share*360;
    slices += `<path d="${describeArcPath(cx,cy,r,angle,endAngle)}" fill="${PIE_PALETTE[i % PIE_PALETTE.length]}" />`;
    angle = endAngle;
  });
  const legend = entries.map((e,i) => {
    const pct = (e.value/total)*100;
    return `<li><span class="pie-swatch" style="background:${PIE_PALETTE[i % PIE_PALETTE.length]}"></span><span class="p-name">${e.name}</span><span class="p-val">${pct.toFixed(1)}%</span></li>`;
  }).join('');
  const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}</svg>`;
  return { svg, legend };
}

function renderSection(def, rows){
  if(!rows.length) return '';
  // Keep only the latest snapshot per parameter (not per whole section) —
  // different fields in the same section may have been captured on different dates
  // (e.g. a manually-added TER on one day, bulk-imported fields on another).
  const byKey = new Map();
  for(const r of rows){
    const key = r.ParameterName || r.FieldName || '—';
    const existing = byKey.get(key);
    if(!existing || r.AsOfDate > existing.AsOfDate) byKey.set(key, r);
  }
  let latest = [...byKey.values()];
  const maxDate = latest.reduce((max, r) => (r.AsOfDate > max ? r.AsOfDate : max), latest[0].AsOfDate);
  if(def.sortDesc){
    latest = [...latest].sort((a,b) => (b.NumericValue ?? -Infinity) - (a.NumericValue ?? -Infinity));
  }
  const hasSource = latest.some(r => r.Source);
  const hasMixedDates = latest.some(r => r.AsOfDate !== maxDate);
  const rowsHtml = latest.map(r => {
    const name = r.ParameterName || r.FieldName || '—';
    const dateNote = hasMixedDates ? ` <span class="desc">(${r.AsOfDate})</span>` : '';
    return `<tr><td>${name}${dateNote}</td><td class="num">${fmtValue(r)}</td>${hasSource ? `<td class="desc">${r.Source||''}</td>` : ''}</tr>`;
  }).join('');
  let totalRowHtml = '';
  if(def.total){
    const sum = latest.reduce((s,r) => s + (r.NumericValue || 0), 0);
    const unit = latest.find(r => r.Unit)?.Unit || '';
    totalRowHtml = `<tr class="total-row"><td>Total</td><td class="num">${fmtDecimal(sum,2)}${unit?` ${unit}`:''}</td>${hasSource ? '<td></td>' : ''}</tr>`;
  }
  const tableHtml = `
    <div class="table-wrap">
    <table>
      <thead><tr><th>${def.nameLabel}</th><th class="num">${def.valueLabel}</th>${hasSource ? '<th>Source</th>' : ''}</tr></thead>
      <tbody>${rowsHtml}${totalRowHtml}</tbody>
    </table>
    </div>
  `;
  let bodyHtml = tableHtml;
  if(def.pie){
    const entries = latest.filter(r => r.NumericValue !== null && r.NumericValue !== undefined && r.NumericValue > 0)
      .map(r => ({ name: r.ParameterName || r.FieldName || '—', value: r.NumericValue }));
    const { svg, legend } = renderPieSvg(entries);
    if(svg){
      bodyHtml = `<div class="chart-flex"><div style="flex:none;">${svg}<ul class="pie-legend">${legend}</ul></div>${tableHtml}</div>`;
    }
  }
  return `
    <div class="section-title-row"><div class="section-title">${def.title}</div></div>
    <div class="section-meta">Stand: ${maxDate}${latest.length !== rows.length ? ` · ${latest.length} Parameter (ältere Snapshots je Parameter ausgeblendet)` : ''}</div>
    ${bodyHtml}
  `;
}

async function loadSecurity(secId){
  curSecId = secId;
  const master = masterAll.find(m => String(m.SecurityID) === String(secId));
  if(!master){ document.getElementById('detailName').textContent = 'Security nicht gefunden.'; return; }

  document.getElementById('detailName').textContent = master.SecurityName;
  document.title = `${master.SecurityName} · Security Data`;
  document.getElementById('sectionsWrap').innerHTML = '<div class="empty">Loading…</div>';
  document.getElementById('linkBackToSecurity').href = `security.html?id=${encodeURIComponent(secId)}`;

  try {
    const data = await tursoQuery(
      `SELECT sd.DataType, sd.FieldName, sd.FieldValue, sd.NumericValue, sd.Unit, sd.AsOfDate, sd.Source, sp.ParameterName
       FROM security_data sd
       LEFT JOIN security_parameter sp ON sp.ParameterID = sd.FieldNameID
       WHERE sd.SecurityID = ?`,
      [secId]
    );
    curData = data;

    document.getElementById('detailMeta').textContent = data.length
      ? `${data.length} Datenpunkt(e) über ${new Set(data.map(r=>r.DataType)).size} Kategorie(n)`
      : 'Keine security_data-Einträge für diese Security.';

    if(!data.length){
      document.getElementById('sectionsWrap').innerHTML = '<div class="empty">Keine Daten vorhanden — läuft der Fund-Data-Collector für diese Security?</div>';
      const url = new URL(location.href); url.searchParams.set('id', secId); history.replaceState(null,'',url);
      return;
    }

    const byType = {};
    for(const row of data){ (byType[row.DataType] = byType[row.DataType] || []).push(row); }

    let html = SECTION_DEFS.map(def => renderSection(def, byType[def.dataType] || [])).join('');

    // Any DataType not covered by SECTION_DEFS (e.g. future 'Fundamental') gets a generic fallback section.
    const knownTypes = new Set(SECTION_DEFS.map(d => d.dataType));
    for(const dataType of Object.keys(byType)){
      if(knownTypes.has(dataType)) continue;
      html += renderSection({ dataType, title: dataType, nameLabel: 'Field', valueLabel: 'Value', sortDesc: false }, byType[dataType]);
    }

    document.getElementById('sectionsWrap').innerHTML = html || '<div class="empty">Keine Daten vorhanden.</div>';
    const url = new URL(location.href); url.searchParams.set('id', secId); history.replaceState(null,'',url);
  } catch (e) {
    document.getElementById('sectionsWrap').innerHTML = `<div class="error">Fehler: ${e.message}</div>`;
  }
}

async function load(){
  if (!tursoConfigured()) {
    document.getElementById('detailName').textContent = 'Bitte ⚙ Repo/Token setzen.';
    document.getElementById('settingsPanel').classList.add('show');
    return;
  }
  try {
    masterAll = await tursoQuery('SELECT SecurityID, SecurityName FROM security_master ORDER BY SecurityName COLLATE NOCASE ASC', [], 3600000);

    const sel = document.getElementById('securitySwitcher');
    sel.innerHTML = masterAll.map(m => `<option value="${m.SecurityID}">${m.SecurityName} · ${m.SecurityID}</option>`).join('');

    const urlId = new URLSearchParams(location.search).get('id');
    const startId = (urlId && masterAll.some(m => String(m.SecurityID)===urlId)) ? urlId : (masterAll[0] && masterAll[0].SecurityID);
    if (!startId) { document.getElementById('detailName').textContent = 'Keine Securities vorhanden.'; return; }
    sel.value = startId;
    sel.addEventListener('change', () => loadSecurity(sel.value));
    await loadSecurity(startId);
  } catch (e) {
    document.getElementById('detailName').textContent = 'Fehler: ' + e.message;
  }
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('cfgUrl').value = TURSO.url;
  document.getElementById('cfgToken').value = TURSO.token;
  document.getElementById('settingsPanel').classList.toggle('show');
});
document.getElementById('cfgSave').addEventListener('click', () => {
  tursoSaveConfig({ url: document.getElementById('cfgUrl').value.trim(), token: document.getElementById('cfgToken').value.trim() });
  document.getElementById('settingsPanel').classList.remove('show');
  load();
});

// ============ Manual data entry ============
let sourceColumnEnsured = false;
async function ensureSourceColumn(){
  if(sourceColumnEnsured) return;
  try { await tursoRun('ALTER TABLE security_data ADD COLUMN Source TEXT'); } catch(e) { /* column likely already exists */ }
  sourceColumnEnsured = true;
}

function populateSectionSelect(){
  const sel = document.getElementById('mfSection');
  sel.innerHTML = SECTION_DEFS.map(d => `<option value="${d.dataType}">${d.title}</option>`).join('')
    + `<option value="__custom__">Other (freitext) …</option>`;
}

async function populateParameterSelect(dataType){
  const sel = document.getElementById('mfParameter');
  const customWrap = document.getElementById('mfCustomParamWrap');
  sel.innerHTML = `<option>Loading…</option>`;
  let opts = [];
  try { opts = await tursoParameterOptions('security_data', dataType, 0); } catch(e) { opts = []; }
  if(opts.length){
    sel.innerHTML = opts.map(o => `<option value="${o.ParameterID}">${o.ParameterName}</option>`).join('')
      + `<option value="__custom__">Other (freitext) …</option>`;
    sel.style.display = '';
    customWrap.style.display = 'none';
  } else {
    sel.innerHTML = `<option value="__custom__">Other (freitext) …</option>`;
    customWrap.style.display = '';
  }
}

document.getElementById('mfSection').addEventListener('change', (e) => {
  const isCustom = e.target.value === '__custom__';
  document.getElementById('mfCustomSectionWrap').style.display = isCustom ? '' : 'none';
  if(!isCustom) populateParameterSelect(e.target.value);
  else {
    document.getElementById('mfParameter').innerHTML = `<option value="__custom__">Other (freitext) …</option>`;
    document.getElementById('mfCustomParamWrap').style.display = '';
  }
});
document.getElementById('mfParameter').addEventListener('change', (e) => {
  document.getElementById('mfCustomParamWrap').style.display = (e.target.value === '__custom__') ? '' : 'none';
});

document.getElementById('addDataBtn').addEventListener('click', async () => {
  const panel = document.getElementById('manualForm');
  const willShow = !panel.classList.contains('show');
  panel.classList.toggle('show');
  if(willShow){
    populateSectionSelect();
    document.getElementById('mfDate').value = nowZurichDateString ? nowZurichDateString() : new Date().toISOString().slice(0,10);
    await populateParameterSelect(document.getElementById('mfSection').value);
  }
});

document.getElementById('mfSave').addEventListener('click', async () => {
  const msg = document.getElementById('mfMsg');
  msg.textContent = ''; msg.className = 'msg';
  if(!curSecId){ msg.textContent = 'Keine Security ausgewählt.'; msg.className = 'msg error'; return; }

  const sectionSel = document.getElementById('mfSection').value;
  const dataType = sectionSel === '__custom__' ? document.getElementById('mfCustomSection').value.trim() : sectionSel;
  if(!dataType){ msg.textContent = 'Bitte Section angeben.'; msg.className = 'msg error'; return; }

  const paramSel = document.getElementById('mfParameter').value;
  let fieldNameId = null, fieldName = '';
  if(paramSel === '__custom__' || !paramSel){
    fieldName = document.getElementById('mfCustomParam').value.trim();
    if(!fieldName){ msg.textContent = 'Bitte Parameter angeben.'; msg.className = 'msg error'; return; }
  } else {
    fieldNameId = Number(paramSel);
    fieldName = document.getElementById('mfParameter').selectedOptions[0]?.textContent || '';
  }

  const rawValue = document.getElementById('mfValue').value.trim();
  if(!rawValue){ msg.textContent = 'Bitte Value angeben.'; msg.className = 'msg error'; return; }
  const isNumeric = /^-?\d+(\.\d+)?$/.test(rawValue);
  const numericValue = isNumeric ? Number(rawValue) : null;
  const fieldValue = isNumeric ? null : rawValue;

  const unit = document.getElementById('mfUnit').value.trim() || null;
  const asOfDate = document.getElementById('mfDate').value || (nowZurichDateString ? nowZurichDateString() : new Date().toISOString().slice(0,10));
  const source = document.getElementById('mfSource').value.trim() || 'Manual Entry';

  try {
    await ensureSourceColumn();
    await tursoRun(
      `INSERT INTO security_data (SecurityID, DataType, FieldName, FieldNameID, FieldValue, NumericValue, Unit, AsOfDate, Source, created_at)
       VALUES (?,?,?,?,?,?,?,?,?,?)`,
      [curSecId, dataType, fieldName, fieldNameId, fieldValue, numericValue, unit, asOfDate, source, nowZurichString ? nowZurichString() : new Date().toISOString()]
    );
    tursoClearCache();
    msg.textContent = 'Gespeichert.'; msg.className = 'msg ok';
    document.getElementById('mfValue').value = '';
    document.getElementById('mfUnit').value = '';
    document.getElementById('mfSource').value = '';
    await loadSecurity(curSecId);
  } catch (e) {
    msg.textContent = 'Fehler: ' + e.message; msg.className = 'msg error';
  }
});

load();
</script>
</body>
</html>
