name: Update security prices CSV

on:
  schedule:
    # UTC times: 01:00, 13:00, 17:00, 18:00, 19:00 daily
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate data/securityprices.csv
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/generate-security-prices.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/securityprices.csv
          if git status --porcelain -- data/securityprices.csv | grep -q .; then
            git commit -m "Update security prices CSV [automated]"
            git push
          else
            echo "No changes to data/securityprices.csv"
          fi
