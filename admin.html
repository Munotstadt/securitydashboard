<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff;--panel:#F7F8FA;--line:#E3E6EA;--text:#1A1D22;--muted:#767E8A;--accent:#E30613; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:32px 16px 80px;display:flex;flex-direction:column;align-items:center;}
  .topnav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:960px;width:100%;margin:0 auto 24px;padding:0 0 10px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .topnav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--text);border-color:var(--line);}
  .topnav a.active{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}
  .wrap{max-width:960px;width:100%;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em;border-bottom:2px solid var(--accent);padding-bottom:14px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:28px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0;}
  .summary-box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;}
  .summary-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .summary-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:4px;}
  .chart-wrap{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 12px 8px;position:relative;}
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .chart-tooltip{position:absolute;pointer-events:none;background:var(--text);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:5;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
  th.num{text-align:right;}
  td{padding:6px;border-bottom:1px solid var(--line);}
  td.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .empty,.error{padding:30px 10px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .error{color:#C0293D;}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .table-wrap{max-height:40vh;overflow-y:auto;}
  .settings{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin:16px 0;display:none;gap:8px;}
  .settings.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
  .settings label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .settings input{font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;width:100%;}
  .settings button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
  .footer{margin-top:14px;display:flex;justify-content:flex-end;gap:8px;}
  .footer button{background:none;border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;}
  .eyebrow{display:flex;align-items:center;justify-content:space-between;width:100%;}
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html">🏠 Home</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="portfolio.html">💼 Portfolio</a>
  <a href="analyser.html">🔬 Analyser</a>
  <a href="master_editor.html">🗂 Master Data</a>
  <a href="price_editor.html">✏️ Prices</a>
  <a href="transactions_editor.html">📋 Transactions</a>
  <a href="distribution_editor.html">💰 Distributions</a>
  <a href="admin.html" class="active">⚙️ Admin</a>
</nav>
<div class="wrap">
  <div class="eyebrow"><h1 style="border:none;padding:0;margin:0;">Admin</h1><span class="status" id="statusText">loading…</span></div>

  <div class="settings" id="settingsPanel">
    <div><label>Turso Database URL</label><input type="text" id="cfgUrl" placeholder="https://…turso.io"></div>
    <div><label>Auth Token</label><input type="text" id="cfgToken" placeholder="eyJ…"></div>
    <div style="align-self:end;"><button id="cfgSave">Apply</button></div>
  </div>

  <div class="summary" id="summaryBoxes"></div>

  <div class="section-title">Prices Added Per Day (last 30 days)</div>
  <div class="chart-wrap" id="chartWrap"><div class="empty">Loading…</div></div>

  <div class="table-wrap">
  <table>
    <thead><tr><th>Date</th><th class="num">Prices Added</th></tr></thead>
    <tbody id="dailyBody"><tr><td colspan="2" class="empty">Loading…</td></tr></tbody>
  </table>
  </div>

  <div class="footer">
    <button id="settingsBtn">⚙ Repo/Token</button>
    <button id="refreshBtn">Refresh</button>
  </div>
</div>

<script src="assets/turso-data.js"></script>
<script>
function daysAgo(from, n){ const d = new Date(from); d.setDate(d.getDate()-n); return d; }
function dayKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtKeyDisplay(key){ const [y,m,d] = key.split('-'); return `${d}.${m}.${y}`; }

function drawBarChart(container, tooltip, buckets){
  const width=800, height=220;
  const pad = {top:14, right:14, bottom:34, left:44};
  const innerW = width-pad.left-pad.right, innerH = height-pad.top-pad.bottom;
  const maxV = Math.max(...buckets.map(b=>b.count), 1);
  const barW = innerW / buckets.length;
  const xScale = i => pad.left + i*barW;
  const yScale = v => pad.top + innerH - (v/maxV)*innerH;

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = (i/4)*maxV, y = yScale(v);
    grid += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="#E3E6EA" stroke-width="1"/>`;
    grid += `<text x="${pad.left-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#767E8A">${Math.round(v)}</text>`;
  }
  let bars = '';
  buckets.forEach((b,i) => {
    const x = xScale(i)+barW*0.15, w = barW*0.7, y = yScale(b.count), h = (pad.top+innerH)-y;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" fill="#E30613" opacity="0.7" class="bar-pt" data-date="${fmtKeyDisplay(b.key)}" data-count="${b.count}"/>`;
  });
  const step = Math.ceil(buckets.length/8);
  let xLabels = '';
  buckets.forEach((b,i) => {
    if(i % step !== 0 && i !== buckets.length-1) return;
    const x = xScale(i)+barW/2;
    xLabels += `<text x="${x.toFixed(1)}" y="${height-10}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#767E8A">${fmtKeyDisplay(b.key).slice(0,5)}</text>`;
  });

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Prices added per day">${grid}${bars}${xLabels}</svg>`;
  container.appendChild(tooltip);
  const svgEl = container.querySelector('svg');
  svgEl.querySelectorAll('.bar-pt').forEach(bar => {
    const show = (evt) => { evt.preventDefault(); showTooltip(evt, container, tooltip, `${bar.dataset.date}: ${bar.dataset.count} prices`); };
    bar.addEventListener('mouseenter', show); bar.addEventListener('mousemove', show);
    bar.addEventListener('touchstart', show, {passive:false});
    bar.addEventListener('mouseleave', () => tooltip.style.display='none');
  });
}
function showTooltip(evt, wrap, tooltip, html){
  const rect = wrap.getBoundingClientRect();
  const x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
  const y = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px'; tooltip.innerHTML = html; tooltip.style.display = 'block';
}

async function load(){
  if (!tursoConfigured()) {
    document.getElementById('chartWrap').innerHTML = '<div class="error">Please set Repo/Token first.</div>';
    document.getElementById('settingsPanel').classList.add('show');
    return;
  }
  try{
    const [masterCount, priceCount, distCount, txnCount, recentPrices] = await Promise.all([
      tursoQuery('SELECT COUNT(*) AS n FROM security_master'),
      tursoQuery('SELECT COUNT(*) AS n FROM security_prices'),
      tursoQuery('SELECT COUNT(*) AS n FROM security_distributions'),
      tursoQuery('SELECT COUNT(*) AS n FROM security_transactions'),
      tursoQuery('SELECT created_at FROM security_prices'),
    ]);

    document.getElementById('summaryBoxes').innerHTML = `
      <div class="summary-box"><div class="summary-label">Securities</div><div class="summary-value">${masterCount[0].n}</div></div>
      <div class="summary-box"><div class="summary-label">Price Rows</div><div class="summary-value">${priceCount[0].n}</div></div>
      <div class="summary-box"><div class="summary-label">Distribution Rows</div><div class="summary-value">${distCount[0].n}</div></div>
      <div class="summary-box"><div class="summary-label">Transaction Rows</div><div class="summary-value">${txnCount[0].n}</div></div>
    `;

    const now = new Date();
    const cutoff = daysAgo(now, 29); cutoff.setHours(0,0,0,0);
    const countsByDay = new Map();
    for(const r of recentPrices){
      const dt = parseSwissDateTime(r.created_at);
      if(!dt || dt < cutoff) continue;
      const key = dayKey(dt);
      countsByDay.set(key, (countsByDay.get(key)||0)+1);
    }
    const buckets = [];
    for(let i=29; i>=0; i--){
      const d = daysAgo(now, i);
      const key = dayKey(d);
      buckets.push({ key, count: countsByDay.get(key) || 0 });
    }

    const tooltip = document.createElement('div'); tooltip.className='chart-tooltip';
    drawBarChart(document.getElementById('chartWrap'), tooltip, buckets);

    document.getElementById('dailyBody').innerHTML = [...buckets].reverse().map(b =>
      `<tr><td>${fmtKeyDisplay(b.key)}</td><td class="num">${b.count}</td></tr>`
    ).join('');

    document.getElementById('statusText').textContent = 'live · ' + nowZurichString();
  }catch(e){
    document.getElementById('chartWrap').innerHTML = `<div class="error">Error: ${e.message}</div>`;
    document.getElementById('statusText').textContent = 'Error';
  }
}

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('cfgUrl').value = TURSO.url;
  document.getElementById('cfgToken').value = TURSO.token;
  document.getElementById('settingsPanel').classList.toggle('show');
});
document.getElementById('cfgSave').addEventListener('click', () => {
  tursoSaveConfig({ url: document.getElementById('cfgUrl').value.trim(), token: document.getElementById('cfgToken').value.trim() });
  document.getElementById('settingsPanel').classList.remove('show');
  load();
});

load();
</script>
</body>
</html>
