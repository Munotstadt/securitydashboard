<style>
  :root{ --bg:#fff;--panel:#F7F8FA;--line:#E3E6EA;--text:#1A1D22;--muted:#767E8A;--accent:#E30613; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:32px 16px 80px;}
  .wrap{max-width:1500px;margin:0 auto;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em;border-bottom:2px solid var(--accent);padding-bottom:14px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;}
  input[type=text], select, input[type=number]{font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 8px;outline:none;}
  input[type=text]:focus, select:focus{border-color:var(--accent);}
  input:disabled{background:#EFF1F4;color:var(--muted);}
  #search{flex:1;min-width:220px;font-size:14px;padding:9px 10px;}
  button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:3px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--text);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.danger{color:#C0293D;border-color:#C0293D;}
  button.danger:hover{background:#C0293D;color:#fff;}
  button:hover{border-color:var(--text);}
  .footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}
  .improvement-input{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 10px;min-width:200px;vertical-align:middle;}
  .improvement-input::placeholder{color:var(--muted);}
  #improvementSaveBtn{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table{width:100%;min-width:1100px;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th[data-sort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover{color:var(--text);}
  th .arrow{color:var(--accent);margin-left:2px;}
  td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;}
  td input, td select{width:100%;box-sizing:border-box;}
  td.name-col input{min-width:0;}
  td.view-col{text-align:center;width:32px;}
  .view-link{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:3px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:12px;}
  .view-link:hover{border-color:var(--accent);color:var(--accent);}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:10px;}
  .status.error{color:#C0293D;} .status.ok{color:#1F8A6E;}
  .settings{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;display:none;gap:8px;}
  .settings.show{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
  .settings label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .table-wrap{overflow-x:auto;}
  .dirty{outline:1px solid #E9A23B !important;}
  .topnav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;max-width:960px;width:100%;margin:0 auto 24px;padding:0 0 10px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;scrollbar-width:none;}
  .topnav::-webkit-scrollbar{display:none;}
  .topnav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;}
  .topnav a:hover{color:var(--text);border-color:var(--line);}
  .nav-dropdown{position:relative;}
  .nav-dropdown>.dd-toggle{background:none;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:3px;border:1px solid transparent;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer;}
  .nav-dropdown>.dd-toggle:hover,.nav-dropdown.open>.dd-toggle{color:var(--text);border-color:var(--line);}
  .nav-dropdown.active-group>.dd-toggle{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}
  .dd-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:4px;min-width:180px;display:none;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.09);z-index:1000;padding:4px;}
  .dd-menu.show{display:flex;}
  .dd-menu a{padding:8px 10px;border-radius:3px;color:var(--muted);text-decoration:none;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .dd-menu a:hover{background:var(--panel);color:var(--text);}
  .dd-menu a.active{color:var(--text);font-weight:600;background:rgba(227,6,19,0.06);}
  .topnav a.active{color:var(--text);font-weight:600;border-color:var(--accent);background:rgba(227,6,19,0.06);}
</style>
</head>

<script>
(function(){
  var dd = document.getElementById('editorsDropdown');
  if(!dd) return;
  var toggle = document.getElementById('editorsToggle');
  var menu = document.getElementById('editorsMenu');
  // Move the menu to <body> so it can never be trapped inside an ancestor's
  // stacking/clipping context (e.g. the horizontally-scrolling topnav).
  document.body.appendChild(menu);
  function positionMenu(){
    var r = toggle.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.left = r.left + 'px';
  }
  function closeMenu(){ dd.classList.remove('open'); menu.classList.remove('show'); }
  function openMenu(){ positionMenu(); dd.classList.add('open'); menu.classList.add('show'); }
  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    if(menu.classList.contains('show')) closeMenu(); else openMenu();
  });
  document.addEventListener('click', function(e){
    if(!dd.contains(e.target) && !menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeMenu();
  });
  window.addEventListener('resize', function(){ if(menu.classList.contains('show')) positionMenu(); });
  window.addEventListener('scroll', function(){ if(menu.classList.contains('show')) positionMenu(); }, true);
})();
</script>

<script>
// Safety net: define the shared schema-guard helpers locally if the loaded
// assets/turso-data.js doesn't have them yet (e.g. stale cached copy). Avoids
// a hard "X is not defined" crash; the real versions in turso-data.js take
// over automatically once that file is up to date (session-cached there).
if (typeof ensureSecurityMasterSchema === 'undefined') {
  window.ensureSecurityMasterSchema = async function(){
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN DateLaunch TEXT'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN DateTerminated TEXT'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN Status INTEGER'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_master ADD COLUMN Comments TEXT'); } catch(e) {}
  };
}
if (typeof ensureSecurityTasksSchema === 'undefined') {
  window.ensureSecurityTasksSchema = async function(){
    try {
      await tursoRun(`CREATE TABLE IF NOT EXISTS security_tasks (
        TaskID INTEGER PRIMARY KEY AUTOINCREMENT,
        TaskName TEXT NOT NULL,
        TaskDescription TEXT,
        SecurityID INTEGER,
        DateDue TEXT,
        Recurring TEXT,
        Completed INTEGER DEFAULT 0,
        CompletedAt TEXT,
        created_at TEXT
      )`);
    } catch(e) {}
    try { await tursoRun('ALTER TABLE security_tasks ADD COLUMN TaskTypeID INTEGER'); } catch(e) {}
    try { await tursoRun('ALTER TABLE security_tasks ADD COLUMN Priority TEXT'); } catch(e) {}
    try {
      await tursoRun(`CREATE TABLE IF NOT EXISTS security_task_completions (
        CompletionID INTEGER PRIMARY KEY AUTOINCREMENT,
        TaskID INTEGER,
        TaskName TEXT,
        SecurityID INTEGER,
        DateDue TEXT,
        CompletedAt TEXT
      )`);
    } catch(e) {}
  };
}
if (typeof ensureSecurityDataSchema === 'undefined') {
  window.ensureSecurityDataSchema = async function(){
    try { await tursoRun('ALTER TABLE security_data ADD COLUMN Source TEXT'); } catch(e) {}
  };
}
if (typeof ensureAssetComparisonSchema === 'undefined') {
  window.ensureAssetComparisonSchema = async function(){
    try { await tursoRun(`CREATE TABLE IF NOT EXISTS asset_comparison_group (
      GroupID INTEGER PRIMARY KEY AUTOINCREMENT,
      GroupName TEXT NOT NULL,
      created_at TEXT
    )`); } catch(e) {}
    try { await tursoRun(`CREATE TABLE IF NOT EXISTS asset_comparison_member (
      GroupID INTEGER NOT NULL,
      SecurityID INTEGER NOT NULL,
      created_at TEXT,
      PRIMARY KEY (GroupID, SecurityID)
    )`); } catch(e) {}
  };
}
if (typeof ensureSecurityCurrenciesSchema === 'undefined') {
  window.ensureSecurityCurrenciesSchema = async function(){
    try {
      await tursoRun(`CREATE TABLE IF NOT EXISTS security_currencies (
        SecurityCurrencyID INTEGER PRIMARY KEY AUTOINCREMENT,
        Cry TEXT,
        SecurityID INTEGER NOT NULL,
        ConversionFactor REAL DEFAULT 1,
        Comments TEXT,
        created_at TEXT
      )`);
    } catch(e) {}
  };
}
if (typeof tursoCurrencyOptions === 'undefined') {
  window.tursoCurrencyOptions = async function(){
    try {
      await ensureSecurityCurrenciesSchema();
      const rows = await tursoQuery("SELECT DISTINCT Cry FROM security_currencies WHERE Cry IS NOT NULL AND Cry <> '' ORDER BY Cry ASC", [], 3600000);
      const list = rows.map(r => r.Cry).filter(Boolean);
      return list.length ? list : ['CHF','EUR','USD','GBP','JPY','INR','CNY','SEK','CAD'];
    } catch(e) {
      return ['CHF','EUR','USD','GBP','JPY','INR','CNY','SEK','CAD'];
    }
  };
}
</script>
<script>
let CURRENCY_OPTS = ['CHF','EUR','USD','GBP','JPY','INR','CNY','SEK','CAD']; // fallback until tursoCurrencyOptions() resolves in load()
const EYE_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;

let rows = [];          // {SecurityID, SecurityName, Currency, Ticker, ID_ISIN, ID_Valor, Collector, DashboardGrouping, Instrument, PortfolioGrouping, _dirty, _new}
let collectorOpts = []; // [{ParameterID, ParameterName}]
let groupingOpts = [];
let instrumentOpts = [];
let portfolioGroupingOpts = [];
let deleteQueue = [];
let sortField = null;
let sortDir = 'asc';

function paramName(opts, id) {
  if (!id) return '';
  const o = opts.find(x => String(x.ParameterID) === String(id));
  return o ? o.ParameterName : '';
}
function compareRows(a, b, field) {
  let av, bv;
  switch (field) {
    case 'Collector': av = paramName(collectorOpts, a.Collector); bv = paramName(collectorOpts, b.Collector); break;
    case 'DashboardGrouping': av = paramName(groupingOpts, a.DashboardGrouping); bv = paramName(groupingOpts, b.DashboardGrouping); break;
    case 'Instrument': av = paramName(instrumentOpts, a.Instrument); bv = paramName(instrumentOpts, b.Instrument); break;
    case 'PortfolioGrouping': av = paramName(portfolioGroupingOpts, a.PortfolioGrouping); bv = paramName(portfolioGroupingOpts, b.PortfolioGrouping); break;
    case 'ID_Valor': case 'SecurityID': return (Number(a[field]) || 0) - (Number(b[field]) || 0);
    default: av = a[field] || ''; bv = b[field] || '';
  }
  return String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
}
function updateSortIndicators() {
  document.querySelectorAll('#headerRow th[data-sort]').forEach(th => {
    th.innerHTML = th.textContent.replace(/\s*[▲▼]$/, '');
    if (th.dataset.sort === sortField) th.innerHTML += ` <span class="arrow">${sortDir === 'asc' ? '▲' : '▼'}</span>`;
  });
}

function optionList(opts, current, allowBlank) {
  let html = allowBlank ? `<option value="" ${!current?'selected':''}>—</option>` : '';
  html += opts.map(o => `<option value="${o.ParameterID}" ${String(current)===String(o.ParameterID)?'selected':''}>${o.ParameterName}</option>`).join('');
  return html;
}
function currencySelect(value) {
  const opts = CURRENCY_OPTS.map(o => `<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('');
  return `<select data-field="Currency">${opts}</select>`;
}

function renderRow(row, idx) {
  const viewLink = row.SecurityID ? `<a class="view-link" href="security.html?id=${row.SecurityID}" title="View">${EYE_SVG}</a>` : '';
  return `<tr data-idx="${idx}" class="${row._dirty?'dirty-row':''}">
    <td class="view-col">${viewLink}</td>
    <td class="name-col"><input type="text" data-field="SecurityName" value="${row.SecurityName||''}"></td>
    <td>${currencySelect(row.Currency)}</td>
    <td><select data-field="Instrument">${optionList(instrumentOpts, row.Instrument, true)}</select></td>
    <td><input type="text" data-field="Ticker" value="${row.Ticker||''}"></td>
    <td><input type="text" data-field="ID_ISIN" value="${row.ID_ISIN||''}"></td>
    <td><input type="number" data-field="ID_Valor" value="${row.ID_Valor||''}"></td>
    <td><select data-field="DashboardGrouping">${optionList(groupingOpts, row.DashboardGrouping, true)}</select></td>
    <td><select data-field="PortfolioGrouping">${optionList(portfolioGroupingOpts, row.PortfolioGrouping, true)}</select></td>
    <td><select data-field="Collector">${optionList(collectorOpts, row.Collector, true)}</select></td>
    <td>${row._new
      ? `<input type="number" data-field="SecurityID" value="${row.SecurityID||''}" style="width:70px">`
      : `<input type="text" value="${row.SecurityID||''}" disabled style="width:70px">`}</td>
    <td><button class="danger" data-del="${idx}">✕</button></td>
  </tr>`;
}
function suggestNextSecurityId(){
  const START_ID = 34000;
  const used = rows.map(r => Number(r.SecurityID)).filter(n => Number.isInteger(n) && n >= START_ID);
  return used.length ? Math.max(...used) + 1 : START_ID;
}

function renderAll(filter='') {
  const body = document.getElementById('body');
  const f = filter.toLowerCase();
  let filtered = rows.map((r,i)=>({r,i})).filter(({r}) => !f ||
    (r.SecurityName||'').toLowerCase().includes(f) ||
    (r.ID_ISIN||'').toLowerCase().includes(f) ||
    (r.Ticker||'').toLowerCase().includes(f));

  if (sortField) {
    filtered = [...filtered].sort((a,b) => {
      const cmp = compareRows(a.r, b.r, sortField);
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }
  updateSortIndicators();

  body.innerHTML = filtered.length ? filtered.map(({r,i}) => renderRow(r,i)).join('') : '<tr><td colspan="12">No matches.</td></tr>';

  body.querySelectorAll('input:not(:disabled), select').forEach(el => {
    el.addEventListener('change', () => {
      const idx = Number(el.closest('tr').dataset.idx);
      rows[idx][el.dataset.field] = el.value === '' ? null : el.value;
      rows[idx]._dirty = true;
      el.classList.add('dirty');
    });
  });
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.del);
      const row = rows[idx];
      if (row._new) {
        if (!confirm('Neue, noch nicht gespeicherte Zeile verwerfen?')) return;
      } else {
        const name = row.SecurityName || '';
        const typed = prompt(`Achtung: "${name}" (SecurityID ${row.SecurityID}) wird gelöscht — dazugehörige Kurse/Ausschüttungen/Transaktionen bleiben bestehen, verweisen dann aber auf eine gelöschte Security.\n\nZum Bestätigen bitte den Namen exakt eintippen:\n${name}`);
        if (typed === null) return;
        if (typed !== name) { alert('Name stimmt nicht überein — Löschung abgebrochen.'); return; }
        deleteQueue.push(row.SecurityID);
      }
      rows.splice(idx,1);
      renderAll(document.getElementById('search').value);
    });
  });
}

async function load() {
  if (!tursoConfigured()) {
    document.getElementById('body').innerHTML = `<tr><td colspan="12">Bitte ⚙ Repo/Token setzen.</td></tr>`;
    document.getElementById('settingsPanel').classList.add('show');
    return;
  }
  try {
    const [masterRows, collectors, groupings, instruments, portfolioGroupings, currencyOpts] = await Promise.all([
      tursoQuery('SELECT SecurityID, SecurityName, Currency, Ticker, ID_ISIN, ID_Valor, Collector, DashboardGrouping, Instrument, PortfolioGrouping FROM security_master ORDER BY SecurityName COLLATE NOCASE ASC'),
      tursoParameterOptions('security_master','Collector'),
      tursoParameterOptions('security_master','DashboardGrouping'),
      tursoParameterOptions('security_master','Instrument'),
      tursoParameterOptions('security_master','PortfolioGrouping'),
      tursoCurrencyOptions(),
    ]);
    collectorOpts = [...collectors].sort((a,b) => a.ParameterName.localeCompare(b.ParameterName));
    groupingOpts = groupings;
    instrumentOpts = instruments;
    portfolioGroupingOpts = portfolioGroupings;
    CURRENCY_OPTS = currencyOpts;
    rows = masterRows.map(r => ({ ...r, _dirty:false, _new:false }));
    deleteQueue = [];
    renderAll();
    setStatus(`${rows.length} securities geladen.`, 'ok');
  } catch (e) {
    document.getElementById('body').innerHTML = `<tr><td colspan="12">Error: ${e.message}</td></tr>`;
  }
}

function setStatus(msg, cls) {
  const s = document.getElementById('status');
  s.textContent = msg; s.className = 'status ' + (cls||'');
}

document.getElementById('search').addEventListener('input', (e) => renderAll(e.target.value));

document.querySelectorAll('#headerRow th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortField = field; sortDir = 'asc'; }
    renderAll(document.getElementById('search').value);
  });
});

document.getElementById('addBtn').addEventListener('click', () => {
  rows.push({SecurityID: suggestNextSecurityId(), SecurityName:'', Currency:'CHF', Ticker:'', ID_ISIN:'', ID_Valor:'', Collector:null, DashboardGrouping:null, Instrument:null, PortfolioGrouping:null, _dirty:true, _new:true});
  document.getElementById('search').value = '';
  sortField = null;
  renderAll('');
  const lastRow = document.querySelector('#body tr:last-child');
  if (lastRow) { lastRow.scrollIntoView({behavior:'smooth', block:'center'}); lastRow.querySelector('input')?.focus(); }
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!tursoConfigured()) { setStatus('Bitte ⚙ Repo/Token setzen.', 'error'); document.getElementById('settingsPanel').classList.add('show'); return; }

  const newRows = rows.filter(r => r._new);
  for (const r of newRows) {
    if (!Number.isInteger(Number(r.SecurityID)) || Number(r.SecurityID) <= 0) {
      setStatus(`Ungültige SecurityID "${r.SecurityID}" für "${r.SecurityName||'(unbenannt)'}" - muss eine positive Ganzzahl sein.`, 'error');
      return;
    }
  }
  const allIds = rows.map(r => Number(r.SecurityID));
  const dupes = allIds.filter((id, i) => allIds.indexOf(id) !== i);
  if (dupes.length) {
    setStatus(`Doppelte SecurityID gefunden: ${[...new Set(dupes)].join(', ')} - bitte eindeutige IDs vergeben.`, 'error');
    return;
  }

  const stmts = [];
  const newRowIdxs = [];
  rows.forEach((r, i) => {
    if (!r._dirty) return;
    if (r._new) {
      stmts.push({ sql: `INSERT INTO security_master (SecurityID, SecurityName, Currency, Ticker, ID_ISIN, ID_Valor, Collector, DashboardGrouping, Instrument, PortfolioGrouping) VALUES (?,?,?,?,?,?,?,?,?,?)`,
        args: [Number(r.SecurityID), r.SecurityName, r.Currency, r.Ticker, r.ID_ISIN, r.ID_Valor||null, r.Collector||null, r.DashboardGrouping||null, r.Instrument||null, r.PortfolioGrouping||null] });
      newRowIdxs.push(i);
    } else {
      stmts.push({ sql: `UPDATE security_master SET SecurityName=?, Currency=?, Ticker=?, ID_ISIN=?, ID_Valor=?, Collector=?, DashboardGrouping=?, Instrument=?, PortfolioGrouping=? WHERE SecurityID=?`,
        args: [r.SecurityName, r.Currency, r.Ticker, r.ID_ISIN, r.ID_Valor||null, r.Collector||null, r.DashboardGrouping||null, r.Instrument||null, r.PortfolioGrouping||null, r.SecurityID] });
    }
  });
  for (const id of deleteQueue) stmts.push({ sql: `DELETE FROM security_master WHERE SecurityID=?`, args: [id] });

  if (!stmts.length) { setStatus('Keine Änderungen.', 'ok'); return; }
  try {
    setStatus('Speichere…');
    const results = await tursoBatch(stmts);
    let newRowsSeen = 0;
    for (let ri = 0; ri < stmts.length; ri++) {
      if (stmts[ri].sql.startsWith('INSERT')) {
        const rowIdx = newRowIdxs[newRowsSeen++];
        rows[rowIdx].SecurityID = results[ri].lastInsertRowid;
        rows[rowIdx]._new = false;
      }
    }
    rows.forEach(r => r._dirty = false);
    deleteQueue = [];
    renderAll(document.getElementById('search').value);
    setStatus('Gespeichert ✓ ' + nowZurichString(), 'ok');
  } catch (e) {
    setStatus('Fehler beim Speichern: ' + e.message, 'error');
  }
});

// ============ Improvement quick-capture (footer) ============
(function(){
  var btn = document.getElementById('improvementSaveBtn');
  if(!btn) return;
  btn.addEventListener('click', async function(){
    var input = document.getElementById('improvementInput');
    var text = input.value.trim();
    if(!text){ return; }
    if(!tursoConfigured()){ alert('Bitte zuerst ⚙ Repo/Token setzen.'); return; }
    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Speichere…';
    try {
      await ensureSecurityTasksSchema();
      var pageName = (location.pathname.split('/').pop() || 'index.html');
      var todayDate = (typeof nowZurichIsoDateString === 'function') ? new Date(nowZurichIsoDateString()+'T00:00:00')
        : (typeof zurichParts === 'function' ? (function(){ var p = zurichParts(new Date()); return new Date(p.year+'-'+p.month+'-'+p.day+'T00:00:00'); })() : new Date());
      var due = new Date(todayDate); due.setDate(due.getDate()+10);
      var dueIso = due.toISOString().slice(0,10);
      var nowIso = (typeof nowZurichString === 'function') ? nowZurichString() : new Date().toISOString();
      await tursoRun(
        `INSERT INTO security_tasks (TaskName, TaskDescription, SecurityID, DateDue, Recurring, TaskTypeID, Completed, created_at) VALUES (?,?,?,?,?,?,0,?)`,
        ['Improvement ' + pageName, text, null, dueIso, 'n/a', 140, nowIso]
      );
      input.value = '';
      alert('Improvement-Task erstellt (fällig ' + dueIso.split('-').reverse().join('.') + ').');
    } catch(e) {
      alert('Fehler: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  });
})();
</script>
